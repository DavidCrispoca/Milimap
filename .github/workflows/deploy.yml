name: Deploy to GitHub Pages

# Publishes the static build (the app is a hash-routed SPA, so no server is
# needed). The QR test sheet is generated during `npm run build` and therefore
# ships with the site at `/qrs/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve Pages URL
        id: pages
        uses: actions/configure-pages@v5
        with:
          # First run creates the Pages site, so deployment does not depend on a
          # manual toggle in Settings. Later runs are a no-op.
          enablement: true

      - name: Build
        # The QR codes embed this URL so the phone's native camera opens the app.
        env:
          MILIMAP_QR_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
