name: Deploy to GitHub Pages

# Publishes the static build (the app is a hash-routed SPA, so no server is
# needed). The QR test sheet is generated during `npm run build` and therefore
# ships with the site at `/qrs/`.
#
# Requires GitHub Pages enabled once with "Source: GitHub Actions"
# (Settings → Pages). Creating the site cannot be automated with GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # The QR codes embed this URL so the phone's native camera opens the app.
        # Derived locally instead of via `configure-pages`: that action needs the
        # Pages site to already exist, and its `enablement` option rejects
        # GITHUB_TOKEN by design. Set the repository variable MILIMAP_SITE_URL
        # when the site moves to a custom domain.
        env:
          MILIMAP_QR_BASE_URL: ${{ vars.MILIMAP_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
